<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#E0F2FE;color:#0F172A;font-family:Inter,system-ui,sans-serif}
.sky{background:#3B82F6;color:#fff;padding:18px 16px 56px}
.top{display:flex;justify-content:space-between;font-weight:600}
.place{font-size:14px;opacity:.9;margin-top:18px}
.time{font-size:52px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.sub{opacity:.9}
.card{background:#fff;border-radius:20px;margin:-36px 16px 12px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.08)}
.card+.card{margin-top:0}
.badge{display:inline-block;background:#DCFCE7;color:#166534;border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px}
.reason{margin-top:8px;font-size:15px}
.h{font-weight:600;font-size:14px;margin-bottom:10px}
.strip{display:flex;gap:6px;overflow:hidden}
.hr{min-width:44px;text-align:center;font-size:12px}
.hr i{display:block;height:36px;border-radius:10px;margin-bottom:4px}
.list{list-style:none;font-size:14px}
.list li{padding:8px 0;border-bottom:1px solid #F1F5F9}
</style></head><body>
<section class="sky">
  <div class="top"><span>UV GO</span><span>☀</span></div>
  <div class="place">Lahore · today</div>
  <div class="time">16:00–18:00</div>
  <div class="sub">Best time to go outside</div>
</section>
<div class="card"><span class="badge">Good</span><p class="reason">UV 3, use sunscreen</p></div>
<div class="card"><div class="h">Today</div>
  <div class="strip">
    <div class="hr"><i style="background:#86EFAC"></i>08</div><div class="hr"><i style="background:#86EFAC"></i>09</div><div class="hr"><i style="background:#FDE047"></i>10</div><div class="hr"><i style="background:#FCA5A5"></i>11</div><div class="hr"><i style="background:#FCA5A5"></i>12</div><div class="hr"><i style="background:#FCA5A5"></i>13</div><div class="hr"><i style="background:#FDE047"></i>14</div>
  </div>
</div>
<div class="card"><div class="h">What to take</div>
  <ul class="list"><li>Sunscreen</li><li>Water</li></ul>
</div>
</body></html>
